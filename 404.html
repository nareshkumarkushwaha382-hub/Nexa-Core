<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages SPA redirect fix
        var pathSegmentsToKeep = 1; // Change to 1 since your repo name is part of the GitHub URL path
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
            (l.search ? '&' + l.search.slice(1) : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
